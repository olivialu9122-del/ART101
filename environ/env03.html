<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Olivia's Dessert World</title>
    <link rel="stylesheet" href="ex02.css">
</head>

<body>

    <h1>Dessert World</h1>

    <p class="subtitle">
        A magical world full of sweets and dreams!
    </p>

    <!-- ZONE 1: ATMOSPHERE -->
    <div class="atmosphere">

        <h2>Welcome to Candyland!</h2>

        <p>
            Welcome to my sweet little world!
            Here, houses are made of cakes,
            clouds are made of cotton candy,
            and every day is full of surprises!
        </p>

    </div>

    <!-- ZONE 2: CHARACTERS AND PROPS -->
    <div class="main-zone">

        <div class="object">
            <img id="candy-house"
                 src="candy house.webp"
                 alt="A colorful candy house">

            <p>Our Candy House</p>
        </div>

        <div class="object">
            <img id="pink-bunny"
                 src="images.jpeg"
                 alt="A cute pink bunny">

            <p>Hi! Welcome to my world!</p>
        </div>

    </div>

</body>
</html>
